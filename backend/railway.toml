[build]
builder = "nixpacks"
buildCommand = "python3 -m pip install -r requirements.txt"

[deploy]
preDeployCommand = "alembic stamp head || true"
startCommand = "gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
