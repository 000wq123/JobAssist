services:
  - type: web
    name: jobassist-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # `alembic upgrade head` runs once per deploy before any worker boots,
    # avoiding the "all gunicorn workers race to migrate" anti-pattern.
    # If you have not yet bootstrapped Alembic, run `alembic stamp head`
    # against the existing prod DB once before redeploying — see
    # backend/alembic/README.md.
    preDeployCommand: alembic upgrade head
    # 2 gunicorn workers — scheduler tasks are coordinated across workers via
    # PostgreSQL advisory locks (see backend/app/core/advisory_lock.py),
    # so duplicate dispatches and resets are impossible.
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_MAX
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: "false"
