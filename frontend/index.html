<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />
    <!-- Anti-flash: apply theme before first paint -->
    <script>
      (function() {
        var t = 'system';
        try { var raw = localStorage.getItem('jobassist_theme_v1'); if (raw) t = raw; } catch(e) {}
        var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', isDark ? '#0C0C10' : '#FAFAF8');
      })();
    </script>

    <!-- SEO / AEO core signals -->
    <title>JobAssist – Bewerben. Klar. Schnell. Mit KI.</title>
    <meta
      name="description"
      content="JobAssist ist die KI-gestützte Job-Plattform für Österreich. Lebenslauf-Analyse, passende Stellen und Anschreiben in Sekunden — alles an einem Ort."
    />
    <meta name="keywords" content="Jobsuche Österreich, KI Bewerbung, Lebenslauf Analyse, Praktikum, Teilzeit, Job-Alert, Bewerbungsassistent" />
    <link rel="canonical" href="https://jobassist.at/" />

    <!-- OpenGraph -->
    <meta property="og:title" content="JobAssist – Bewerben. Klar. Schnell. Mit KI." />
    <meta property="og:description" content="KI-gestützte Jobsuche für Österreich. Lebenslauf-Analyse, passende Stellen und Anschreiben in Sekunden." />
    <meta property="og:image" content="https://jobassist.at/android-chrome-512x512.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jobassist.at/" />
    <meta property="og:locale" content="de_AT" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobAssist – Bewerben. Klar. Schnell. Mit KI." />
    <meta name="twitter:description" content="KI-gestützte Jobsuche für Österreich. Lebenslauf-Analyse, passende Stellen und Anschreiben in Sekunden." />
    <meta name="twitter:image" content="https://jobassist.at/android-chrome-512x512.png" />

    <!-- JSON-LD: Organization + Product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "JobAssist",
            "url": "https://jobassist.at",
            "logo": "https://jobassist.at/android-chrome-512x512.png",
            "sameAs": [
              "https://twitter.com/jobassist_at"
            ]
          },
          {
            "@type": "WebApplication",
            "name": "JobAssist",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "offers": [
              {
                "@type": "Offer",
                "name": "Kostenlos",
                "price": "0",
                "priceCurrency": "EUR"
              }
            ],
            "description": "KI-gestützte Job-Plattform für Österreich. Lebenslauf-Analyse, passende Stellen und Anschreiben in Sekunden.",
            "url": "https://jobassist.at",
            "inLanguage": "de-AT",
            "audience": {
              "@type": "Audience",
              "audienceType": "Young professionals and students in Austria seeking internships, part-time, and entry-level jobs"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
