name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Temporary stable subset of e2e tests. Expand the list in
  # frontend/package.json > test:e2e:stable as more specs are fixed.
  frontend-e2e-stable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:stable
      - name: Upload stable e2e report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: stable-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  frontend-e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload full e2e report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  frontend-visual:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:visual
      - name: Upload visual regression report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  chrome-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate extension source and public integration
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/content/jobassist-bridge.js
          node --check chrome-extension/content/application-assistant.js
          node --check chrome-extension/popup/popup.js
          node --check chrome-extension/onboarding/onboarding.js
          node chrome-extension/scripts/validate-release.mjs
      - name: Test extension UI and browser handoff
        run: |
          node chrome-extension/tests/ui-smoke.mjs
          node chrome-extension/tests/smoke.mjs
      - name: Build and test public extension demo
        working-directory: frontend
        run: |
          npm run build
          npx playwright test e2e/extension-demo.spec.js --project=chromium
      - name: Build Chrome Web Store package
        run: |
          sh chrome-extension/scripts/package.sh
          unzip -t chrome-extension/dist/jobassist-bewerbungshelfer-*.zip
      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: jobassist-chrome-extension
          path: chrome-extension/dist/*.zip
          if-no-files-found: error

  frontend-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fail the job on high or critical vulnerabilities. Continue past
      # moderate/low so PRs aren't blocked by transitive churn.
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest tests

  # Live Groq model-availability check. Fails the pipeline when a configured
  # model (MODEL / MODEL_FALLBACK in claude_service.py) is deprecated and
  # removed by Groq — the failure mode behind the cover-letter 500 outage.
  backend-model-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "true"
      DATABASE_URL: sqlite+aiosqlite:///./modelcheck.db
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify configured Groq models exist
        run: python -m pytest tests/test_claude_service.py -k "configured_models" -vv

  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "true"
      DATABASE_URL: sqlite+aiosqlite:///./smoke.db
      STRIPE_SECRET_KEY: ""
      GROQ_API_KEY: ""
      ADZUNA_APP_ID: ""
      ADZUNA_APP_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Start app in background
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
      - name: Smoke /health
        run: |
          curl -fsS http://127.0.0.1:8000/health | jq -e '.status == "ok"'
      - name: Smoke /health/dependencies
        run: |
          curl -fsS 'http://127.0.0.1:8000/health/dependencies?deep=true' | jq -e '.ready == true or .ready == false'
      - name: Smoke /metrics
        run: |
          curl -fsS http://127.0.0.1:8000/metrics | jq -e '.users_total >= 0'

  backend-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      # Pinned-version vulnerability scan. Only high/critical vulns cause a
      # non-zero exit; moderate/low are reported but don't block CI.
      - run: pip-audit --skip-editable 2>&1 | tee /tmp/audit.txt; test ! -s /tmp/audit.txt || ! grep -Eiq '(high|critical) severity' /tmp/audit.txt
